name: Publish Gentoo demo image

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-image:
    name: Verify release and publish GHCR demo
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/arran4/eselect-version-manager:${{ github.event.release.tag_name }}
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate version and main ancestry
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a stable Gentoo-compatible tag such as v0.1.0" >&2
            exit 2
          }
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release tag must point to a commit already merged into main" >&2
            exit 2
          }
          echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Check out companion overlay (reviewed revision)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: arran4/eselect-version-manager-overlay
          ref: edf100b4c11f482272f6e66153da1f0cf215c545
          path: overlay

      - name: Verify matching versioned ebuild
        run: test -f "overlay/app-eselect/eselect-version-manager/eselect-version-manager-${{ steps.version.outputs.version }}.ebuild"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Re-run Gentoo E2E against published source archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: e2e
          platforms: linux/amd64
          push: false
          build-args: |
            VM_VERSION=${{ steps.version.outputs.version }}
            VM_SOURCE=release
          cache-from: type=gha,scope=eselect-gentoo-e2e
          cache-to: type=gha,scope=eselect-release,mode=max,ignore-error=true

      - name: Build demo image from the same release archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: demo
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            VM_VERSION=${{ steps.version.outputs.version }}
            VM_SOURCE=release
          cache-from: |
            type=gha,scope=eselect-release
            type=gha,scope=eselect-gentoo-demo
          cache-to: type=gha,scope=eselect-release-demo,mode=max,ignore-error=true

      - name: Verify demo image before publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker run --rm --workdir /home/demo/projects/slot-1 "${IMAGE}" fixture-tool | grep -c 'version 1.0 (slot 1)')" -eq 1
          test "$(docker run --rm --workdir /home/demo/projects/slot-2 "${IMAGE}" fixture-tool | grep -c 'version 2.0 (slot 2)')" -eq 1
          docker run --rm "${IMAGE}" python3 --version
          docker run --rm "${IMAGE}" eselect version-manager resolve fixture
          test "$(docker run --rm "${IMAGE}" id -un)" = demo

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified version tag
        run: docker push "${IMAGE}"
