name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Validation or a validated release operation
        type: choice
        required: true
        default: verify
        options:
          - verify
          - release-patch
          - release-minor
          - release-major
          - publish-tag
      release_version_override:
        description: Explicit version for first release/recovery, e.g. 0.1.0
        type: string
        required: false
  schedule:
    - cron: '0 19 1 * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-validation:
    name: Fast Validation (Static Analysis & Unit Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"

      - name: Shell syntax and static analysis
        run: |
          echo "=== Checking shell syntax ==="
          bash -n modules/version-manager.eselect
          bash -n scripts/run_gentoo_e2e.sh
          bash -n scripts/test_in_gentoo.sh
          test -f Dockerfile
          test -f .dockerignore

      - name: Python syntax check
        run: |
          echo "=== Checking Python syntax ==="
          python3 -m py_compile bin/dispatcher $(find eselect_version_manager tests -name "*.py")

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest

      - name: Run standalone test runner
        run: |
          python3 tests/test_runner.py

      - name: Run pytest with verbose coverage
        run: |
          python3 -m pytest tests/ -v -s

  gentoo-e2e:
    name: Real Gentoo End-to-End Portage Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out dedicated Portage overlay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: arran4/eselect-version-manager-overlay
          ref: 6e8fcc74566b1543956a05e683b737dc4dae155f
          path: overlay

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build shared Gentoo Dockerfile and run real Portage E2E
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: e2e
          push: false
          platforms: linux/amd64
          build-args: |
            VM_VERSION=0.1.0
            VM_SOURCE=checkout
          cache-from: |
            type=gha,scope=eselect-gentoo-e2e
            type=gha,scope=eselect-gentoo-demo
          cache-to: type=gha,scope=eselect-gentoo-e2e,mode=max,ignore-error=true

      - name: Build non-root demonstration image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: demo
          push: false
          load: true
          tags: eselect-version-manager:ci-demo
          platforms: linux/amd64
          build-args: |
            VM_VERSION=0.1.0
            VM_SOURCE=checkout
          cache-from: type=gha,scope=eselect-gentoo-e2e
          cache-to: type=gha,scope=eselect-gentoo-demo,mode=max,ignore-error=true

      - name: Smoke-test both demonstration projects
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --workdir /home/demo/projects/slot-1 eselect-version-manager:ci-demo fixture-tool | grep -F 'version 1.0 (slot 1)'
          docker run --rm --workdir /home/demo/projects/slot-2 eselect-version-manager:ci-demo fixture-tool | grep -F 'version 2.0 (slot 2)'
          docker run --rm eselect-version-manager:ci-demo python3 --version
          test "$(docker run --rm eselect-version-manager:ci-demo id -un)" = demo

  release-ready:
    name: Release Quality Gates Passed
    needs: [fast-validation, gentoo-e2e]
    if: >-
      ${{ always() && (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'verify')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require verified source and real Gentoo integration
        env:
          UNIT_RESULT: ${{ needs.fast-validation.result }}
          E2E_RESULT: ${{ needs.gentoo-e2e.result }}
        run: |
          set -euo pipefail
          test "$UNIT_RESULT" = success
          test "$E2E_RESULT" = success

  prepare-release-tag:
    name: Prepare immutable release tag
    needs: [release-ready]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
      startsWith(inputs.mode, 'release-') &&
      needs.release-ready.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: eselect-version-manager-release-preparation
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout the validated main revision and all tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify main has not advanced and calculate the next version
        id: tag
        shell: bash
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          VERSION_OVERRIDE: ${{ inputs.release_version_override }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || {
            echo 'Release preparation must run from main' >&2
            exit 1
          }
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo 'main advanced after validation; retry against the new commit' >&2
            exit 1
          }
          if [[ -n "$VERSION_OVERRIDE" ]]; then
            tag="v${VERSION_OVERRIDE#v}"
          else
            latest="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            base="${latest#v}"
            if [[ -z "$latest" ]]; then
              echo 'First release requires release_version_override (e.g. 0.1.0)' >&2
              exit 2
            fi
            IFS='.' read -r major minor patch <<< "$base"
            case "$RELEASE_MODE" in
              release-major) major=$((major+1)); minor=0; patch=0 ;;
              release-minor) minor=$((minor+1)); patch=0 ;;
              release-patch) patch=$((patch+1)) ;;
              *) echo "Unsupported release mode: $RELEASE_MODE" >&2; exit 2 ;;
            esac
            tag="v$major.$minor.$patch"
          fi
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Invalid stable Gentoo release tag: $tag" >&2
            exit 2
          }
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists. Use publish-tag from that tag to recover." >&2
            exit 1
          fi
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo 'main advanced before tagging; refusing to tag' >&2
            exit 1
          }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "$tag" -m "Release $tag"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publisher:
    name: Verify tagged archive and publish GHCR + GitHub Release
    needs: [fast-validation, gentoo-e2e, release-ready, prepare-release-tag]
    if: >-
      ${{ always() && needs.release-ready.result == 'success' &&
      (needs.prepare-release-tag.result == 'success' ||
      (startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-tag')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: eselect-version-manager-publish-${{ needs.prepare-release-tag.outputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ needs.prepare-release-tag.outputs.tag || github.ref_name }}
    steps:
      - name: Checkout the exact immutable release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare-release-tag.outputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Verify tag shape, git ancestry and immutability
        shell: bash
        env:
          MANUAL_MODE: ${{ inputs.mode }}
          VERSION_OVERRIDE: ${{ inputs.release_version_override }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 2
          git fetch origin main --tags
          git merge-base --is-ancestor HEAD origin/main || {
            echo 'Tag is not part of authoritative main' >&2
            exit 1
          }
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          if [[ "$MANUAL_MODE" == 'publish-tag' ]]; then
            test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" || {
              echo 'publish-tag recovery must be launched on the existing tag ref' >&2
              exit 2
            }
            if [[ -n "$VERSION_OVERRIDE" ]]; then
              test "v${VERSION_OVERRIDE#v}" = "$RELEASE_TAG" || exit 2
            fi
          fi
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/arran4/eselect-version-manager:$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Checkout reviewed companion overlay revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: arran4/eselect-version-manager-overlay
          ref: 6e8fcc74566b1543956a05e683b737dc4dae155f
          path: overlay
      - name: Prepare versioned ebuild in disposable Docker context
        shell: bash
        run: |
          set -euo pipefail
          package_dir=overlay/app-eselect/eselect-version-manager
          versioned="$package_dir/eselect-version-manager-$VERSION.ebuild"
          if [[ ! -f "$versioned" ]]; then
            test -f "$package_dir/eselect-version-manager-0.1.0.ebuild"
            cp "$package_dir/eselect-version-manager-0.1.0.ebuild" "$versioned"
          fi
          # This is a build-context copy only. The companion overlay workflow
          # independently opens the reviewed release ebuild/Manifest PR.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Gentoo E2E against the real tagged source archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: e2e
          platforms: linux/amd64
          push: false
          build-args: |
            VM_VERSION=${{ env.VERSION }}
            VM_SOURCE=release
          cache-from: type=gha,scope=eselect-gentoo-e2e
          cache-to: type=gha,scope=eselect-release-e2e,mode=max,ignore-error=true
      - name: Build the same tested source as a non-root demo image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: demo
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            VM_VERSION=${{ env.VERSION }}
            VM_SOURCE=release
          cache-from: type=gha,scope=eselect-release-e2e
          cache-to: type=gha,scope=eselect-release-demo,mode=max,ignore-error=true
      - name: Test the actual built container before publishing
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --workdir /home/demo/projects/slot-1 "$IMAGE" fixture-tool | grep -F 'version 1.0 (slot 1)'
          docker run --rm --workdir /home/demo/projects/slot-2 "$IMAGE" fixture-tool | grep -F 'version 2.0 (slot 2)'
          docker run --rm "$IMAGE" python3 --version
          test "$(docker run --rm "$IMAGE" id -un)" = demo
          docker run --rm "$IMAGE" eselect version-manager resolve fixture
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified GHCR image
        run: docker push "$IMAGE"
      - name: Publish or verify the single GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; not creating a second release"
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              --title "eselect-version-manager $RELEASE_TAG"
          fi
          echo "The overlay's tagged ebuild/Manifest requires its own reviewed update PR."
