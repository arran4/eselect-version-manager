name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    name: Fast Validation (Static Analysis & Unit Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"

      - name: Shell syntax and static analysis
        run: |
          echo "=== Checking shell syntax ==="
          bash -n modules/version-manager.eselect
          bash -n scripts/run_gentoo_e2e.sh
          bash -n scripts/test_in_gentoo.sh

      - name: Python syntax check
        run: |
          echo "=== Checking Python syntax ==="
          python3 -m py_compile bin/dispatcher $(find eselect_version_manager tests -name "*.py")

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest

      - name: Run standalone test runner
        run: |
          python3 tests/test_runner.py

      - name: Run pytest with verbose coverage
        run: |
          python3 -m pytest tests/ -v -s

  gentoo-e2e:
    name: Real Gentoo End-to-End Portage Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Pull official Gentoo container images
        run: |
          docker pull gentoo/portage:latest
          docker pull gentoo/stage3:latest

      - name: Run Gentoo End-to-End Test Suite
        run: |
          ./scripts/run_gentoo_e2e.sh
