name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    name: Fast Validation (Static Analysis & Unit Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"

      - name: Shell syntax and static analysis
        run: |
          echo "=== Checking shell syntax ==="
          bash -n modules/version-manager.eselect
          bash -n scripts/run_gentoo_e2e.sh
          bash -n scripts/test_in_gentoo.sh
          test -f Dockerfile
          test -f .dockerignore

      - name: Python syntax check
        run: |
          echo "=== Checking Python syntax ==="
          python3 -m py_compile bin/dispatcher $(find eselect_version_manager tests -name "*.py")

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest

      - name: Run standalone test runner
        run: |
          python3 tests/test_runner.py

      - name: Run pytest with verbose coverage
        run: |
          python3 -m pytest tests/ -v -s

  gentoo-e2e:
    name: Real Gentoo End-to-End Portage Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out dedicated Portage overlay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: arran4/eselect-version-manager-overlay
          ref: edf100b4c11f482272f6e66153da1f0cf215c545
          path: overlay

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build shared Gentoo Dockerfile and run real Portage E2E
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: e2e
          push: false
          platforms: linux/amd64
          build-args: |
            VM_VERSION=0.1.0
            VM_SOURCE=checkout
          cache-from: |
            type=gha,scope=eselect-gentoo-e2e
            type=gha,scope=eselect-gentoo-demo
          cache-to: type=gha,scope=eselect-gentoo-e2e,mode=max,ignore-error=true

      - name: Build non-root demonstration image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: demo
          push: false
          load: true
          tags: eselect-version-manager:ci-demo
          platforms: linux/amd64
          build-args: |
            VM_VERSION=0.1.0
            VM_SOURCE=checkout
          cache-from: type=gha,scope=eselect-gentoo-e2e
          cache-to: type=gha,scope=eselect-gentoo-demo,mode=max,ignore-error=true

      - name: Smoke-test both demonstration projects
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --workdir /home/demo/projects/slot-1 eselect-version-manager:ci-demo fixture-tool | grep -F 'version 1.0 (slot 1)'
          docker run --rm --workdir /home/demo/projects/slot-2 eselect-version-manager:ci-demo fixture-tool | grep -F 'version 2.0 (slot 2)'
          docker run --rm eselect-version-manager:ci-demo python3 --version
          test "$(docker run --rm eselect-version-manager:ci-demo id -un)" = demo
