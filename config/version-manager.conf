# /etc/eselect/version-manager.conf
# System-wide configuration defaults for eselect-version-manager.
#
# Syntax: Gentoo-style variable assignments (KEY="value").
# Declaratively parsed; arbitrary shell execution is strictly forbidden.
#
# Default toolchain versions when not overridden by user or project scopes:
# Supported values:
#   "system"            - Delegate to existing Gentoo system binary
#   "latest"            - Newest installed compatible version
#   "<series>"          - e.g. "1.26" for Go 1.26 series (=dev-lang/go-1.26*)
#   "<version>"         - e.g. "1.26.3" for exact pin (=dev-lang/go-1.26.3)
#   "<range>"           - e.g. ">=1.26 <1.27"
#   "=<atom>"           - e.g. "=dev-lang/go-1.26.3"
#   ":<slot>"           - e.g. ":1.26"
#   "from-file"         - Native version detection (e.g. go.mod / go.work)

VM_GO="system"
