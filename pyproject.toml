[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eselect-version-manager"
version = "0.1.0"
description = "Gentoo-native project-aware toolchain version manager"
authors = [{ name = "arran4", email = "arran4@users.noreply.github.com" }]
license = { text = "GPL-2.0-or-later" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
eselect-version-manager = "eselect_version_manager.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
